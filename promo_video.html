<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoción Oficial 9:16 - App Tasas Venezuela & BCV</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #060911;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Pure 9:16 Vertical Canvas */
        .promo-container-916 {
            width: 432px;
            height: 768px; /* Standard 9:16 Aspect Ratio */
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 55%, #020617 100%);
            border-radius: 32px;
            border: 2px solid rgba(16, 185, 129, 0.35);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(16, 185, 129, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 28px 22px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow Effects */
        .glow-1 { position: absolute; top: -100px; left: -100px; width: 320px; height: 320px; background: rgba(16, 185, 129, 0.28); filter: blur(95px); border-radius: 50%; pointer-events: none; }
        .glow-2 { position: absolute; bottom: -100px; right: -100px; width: 320px; height: 320px; background: rgba(59, 130, 246, 0.28); filter: blur(95px); border-radius: 50%; pointer-events: none; }

        /* Header Section */
        .header-area {
            text-align: center;
            z-index: 2;
            width: 100%;
        }

        .badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            color: #10B981;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 12px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 21px;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 span {
            background: linear-gradient(135deg, #10B981 0%, #3B82F6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Phone Frame 3D Center */
        .phone-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        .phone-frame {
            width: 240px;
            height: 450px;
            background: #0f172a;
            border: 9px solid #1e293b;
            border-radius: 38px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85), 0 0 35px rgba(16, 185, 129, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .notch {
            width: 80px;
            height: 15px;
            background: #1e293b;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            z-index: 10;
        }

        .phone-screen {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .slide-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .slide-element.active {
            opacity: 1;
        }

        /* Bottom Feature Card */
        .bottom-card {
            z-index: 2;
            width: 100%;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .bullet-item {
            font-size: 10px;
            font-weight: 700;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-primary-vertical {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: #ffffff;
            font-weight: 800;
            font-size: 13px;
            padding: 11px;
            border-radius: 14px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
            display: block;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.02); } }
    </style>
</head>
<body>

    <!-- Canvas 9:16 Vertical Puro para Reels, TikTok y WhatsApp -->
    <div class="promo-container-916">
        <div class="glow-1"></div>
        <div class="glow-2"></div>

        <!-- Encabezado -->
        <div class="header-area">
            <div class="badge-tag">
                <span>🇻🇪</span> TASAS VENEZUELA BY @ENSTOR
            </div>
            <h1>La App Esencial para <span>Comprar y Calcular</span> a Tasa BCV</h1>
        </div>

        <!-- Celular 3D Centrado con el Video Real -->
        <div class="phone-wrapper">
            <div class="phone-frame">
                <div class="notch"></div>
                <div class="phone-screen">
                    <video id="promoVideo" class="slide-element active" src="promo_assets/video.mp4" autoplay loop muted playsinline></video>
                    <img src="promo_assets/Screenshot_20261117-235448.jpg" class="slide-element" alt="Widget BCV">
                    <img src="promo_assets/Screenshot_20261117-235329.jpg" class="slide-element" alt="Calculadora de Mercado">
                    <img src="promo_assets/Screenshot_20261117-235417.jpg" class="slide-element" alt="Desglose de Vuelto">
                </div>
            </div>
        </div>

        <!-- Tarjeta de Características y Botón CTA -->
        <div class="bottom-card">
            <div class="feature-grid">
                <div class="bullet-item">🟢 Widget BCV en Vivo</div>
                <div class="bullet-item">🛒 Calculadora de Mercado</div>
                <div class="bullet-item">💡 Vuelto (Billetes+PagoMóvil)</div>
                <div class="bullet-item">🔒 Licencias Personales/Comercio</div>
            </div>

            <a href="#" class="btn-primary-vertical">
                🚀 ¡Pide tu Prueba Gratis Hoy al DM / WhatsApp!
            </a>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide-element');

        // Auto alternar cada 4 segundos
        setInterval(() => {
            slides.forEach(s => s.classList.remove('active'));
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');

            if (currentSlide === 0) {
                const video = document.getElementById('promoVideo');
                if (video) video.play();
            }
        }, 4000);
    </script>
</body>
</html>
